<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Hors connexion · E.doto family</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
         background: #F9F8F6; color: #1A1814; font-family: Poppins, Arial, sans-serif; text-align: center; }
  main { max-width: 360px; }
  img { width: 88px; height: 88px; border-radius: 22px; }
  h1 { font-size: 20px; font-weight: 600; margin: 20px 0 8px; }
  p { font-size: 14px; line-height: 1.6; color: #6B655D; margin: 0 0 24px; }
  .btn { display: inline-block; text-decoration: none; border: 0; border-radius: 999px; background: #C2185B; color: #fff; font: inherit; font-size: 14px;
           font-weight: 600; padding: 12px 28px; cursor: pointer; }
  .brand { color: #C2185B; }
</style>
</head>
<body>
<main>
  <img src="/app/icon-192.png" alt="">
  <h1>Vous êtes hors connexion</h1>
  <p>E.doto <span class="brand">family</span> a besoin d'internet pour afficher cette page. Vérifiez votre connexion, puis réessayez.</p>
  <a class="btn" href="">Réessayer</a>
</main>
</body>
</html>
